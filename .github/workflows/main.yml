name: Build Desktop Application

on:
  push:
    branches: [develop, master]

defaults:
  run:
    shell: powershell

jobs:
  build:
    name: Build Windows App
    runs-on: windows-2025
    env:
      # 建议切换为 x64 版本的 signtool 避免 32 位内存溢出
      SIGNTOOL_PATH: 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe'
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7       
        with:
          cache: "pnpm"

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9        

      # ✨ 修复点 1：在执行任何脚本前，必须先安装项目依赖


      - name: Install web
        run: pnpm install
        working-directory: apps/web

      - name: Install nx web
        run: pnpm install nx@latest -D
        working-directory: apps/web

      - name: Install desktop
        run: pnpm install
        working-directory: apps/desktop

      - name: Install nx desktop
        run: pnpm install nx@latest -D
        working-directory: apps/desktop

      - name: build  web
        run: pnpm build
        working-directory: apps/web
        shell: bash

      # ✨ 修复点 2：如果是 TS 脚本，推荐通过 pnpm 依赖内的工具或 package.json 脚本执行
      # 如果你的 package.json 里面有 "pack": "ts-node scripts/pack.ts"，推荐改为：pnpm run pack
      - name: Run Pack Script
        run: pnpm node scripts/pack.ts
        working-directory: apps/desktop

      - name: Build MSI Package
        run: pnpm build:64 -w msi -- --publish never
        working-directory: apps/desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
            name: production-files-win
            path: |
                apps/desktop/dist
            retention-days: 1