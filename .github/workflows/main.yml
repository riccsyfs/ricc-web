defaults:
  run:
    shell: powershell

on: 
  push:
    branches: [develop, master]

jobs:
  build:
    name: Build Windows ${{ inputs.arch }}
    runs-on: windows-2025
    env:
      SIGNTOOL_PATH: "C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x86/signtool.exe"

    steps:

      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. (Recommended) Set up Node/pnpm if not already cached/installed globally
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        
      - name: a
        run: pnpm run node scripts/pack.ts
        working-directory: "apps\\desktop" 

      - name: b
        run: pnpm run build --publish never -w msi
        shell: bash
        working-directory: "apps\\desktop" 